name: Despliegue de Documentacion

on:
  push:
    branches:
      - main

# Permisos mínimos requeridos para desplegar en GitHub Pages nativo
permissions:
  contents: read
  pages: write
  id-token: write

# Permite solo un despliegue concurrente para evitar colisiones
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias documentales
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar sitio web estático
        run: mkdocs build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
