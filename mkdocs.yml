site_name: Dronkab Docs
site_description: Base de conocimiento técnico y documentación viva de Dronkab.
site_author: Equipo Dronkab
site_url: https://dronkab-unaq.github.io/dronkab-docs/

theme:
  name: material
  language: es
  
  # Identidad visual (rutas relativas a la carpeta docs/)
  logo: assets/img/logo_dronkab.png
  favicon: assets/img/favicon.ico

  # Paleta de colores con conmutador automatico claro/oscuro
  palette:
    # Modo oscuro (predeterminado para entorno de ingenieria)
    - scheme: slate
      primary: orange
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

    # Modo claro
    - scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

  # Funcionalidades de navegacion e interaccion visual
  features:
    - navigation.instant        # Carga ultra-rapida tipo SPA (Single Page Application)
    - navigation.tracking       # Resalta la seccion actual en el menu segun el scroll
    - navigation.tabs           # Barra superior de pestañas tematicas
    - navigation.tabs.sticky    # Mantiene visibles las pestañas al desplazarse hacia abajo
    - navigation.top            # Boton flotante para regresar arriba
    - navigation.indexes        # Permite hacer clic en la carpeta contenedora
    - toc.follow                # El menu lateral derecho sigue el scroll del lector
    - search.suggest            # Sugerencias instantaneas al teclear en el buscador
    - search.highlight          # Resalta las coincidencias dentro de la pagina
    - content.code.copy         # Boton de copiar con un clic en cada bloque de codigo
    - content.action.edit       # Boton para sugerir cambios directos en GitHub

# Enlace de estilos CSS personalizados
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  # Cajas de advertencia y notas (Callouts / Admonitions)
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  # Resaltado de sintaxis en bloques de código
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Formulación matemática (LaTeX / MathJax / KaTeX)
  - pymdownx.arithmatex:
      generic: true

  # Tablas y formato semántico
  - tables
  - attr_list
  - md_in_html

# Enlace a los scripts de renderizado matemático
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# Navegación provisional (implementa un menú por carpetas)
nav:
  - Inicio: index.md
  
  - Onboarding:
      - Bienvenido al equipo: onboarding/primeros_pasos.md
      - Flujo Git y contribución: onboarding/flujo_git.md
      - Ecosistema Docker:
          - Visión general y arquitectura: onboarding/docker/entorno_docker.md
          - Entorno de desarrollo (PC): onboarding/docker/entorno_docker_dev.md
          - Entorno embebido (dron): onboarding/docker/entorno_docker_dron.md

  - Hardware:
      - Ejemplo de documentación: hardware/ejemplo_documento.md
      - LiDAR:
          - Proyecto de estadía: hardware/lidar/estadia_lidar.md

  - Algoritmos:
      - Ejemplo de documentación: algoritmos/ejemplo_documento.md

  - Operaciones:
      - Checklist pre-vuelo: operaciones/checklist_vuelo.md
